name: Deploy PWA to VPS

# Builds the web (PWA) flavor with base /app/ and rsyncs it to the securo
# VPS, where Caddy serves it same-origin at https://$DOMAIN/app/.
#
# Required repo secrets:
#   VPS_HOST      e.g. 203.0.113.7 or securo.example.com
#   VPS_USER      SSH user (e.g. root)
#   VPS_SSH_KEY   private key (ed25519) authorized on the VPS
# Optional:
#   VPS_PWA_PATH  target dir (default /opt/securo/pwa, must match the
#                 caddy volume mount in docker-compose.alpha.yml)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PWA_BASE: /app/
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync dist to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PWA_PATH || '/opt/securo/pwa' }}/"
