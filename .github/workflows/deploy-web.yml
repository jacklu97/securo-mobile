name: Deploy PWA to VPS

# Builds the web (PWA) flavor and rsyncs it to the securo VPS, where Caddy
# serves it at the root of https://$PWA_DOMAIN (with /api proxied on that
# same origin).
#
# Required repo secrets:
#   VPS_HOST      e.g. 203.0.113.7 or securo.example.com
#   VPS_USER      SSH user (e.g. root)
#   VPS_SSH_KEY   private key (ed25519) authorized on the VPS
# Optional:
#   VPS_PWA_PATH  target dir (default /opt/securo/pwa, must match the
#                 caddy volume mount in docker-compose.alpha.yml)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate secrets shape
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # Diagnose malformed values without printing them.
          fail=0
          case "$VPS_HOST" in
            *[@/:]*) echo "::error::VPS_HOST must be a bare hostname/IP (found @, / or :)"; fail=1 ;;
          esac
          if [ "$(printf %s "$VPS_HOST" | wc -w)" != "1" ]; then
            echo "::error::VPS_HOST contains whitespace"; fail=1
          fi
          case "$VPS_SSH_KEY" in
            *"PRIVATE KEY"*) : ;;
            *) echo "::error::VPS_SSH_KEY does not look like a private key (paste the file contents incl. BEGIN/END lines)"; fail=1 ;;
          esac
          exit $fail
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Rsync dist to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PWA_PATH || '/opt/securo/pwa' }}/"
